name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Test
        if: matrix.go == '1.22.x'
        run: go test ./... -count=1 -timeout=30s
      - name: Vet
        run: go vet ./...
      - name: Race
        if: matrix.go == 'stable'
        run: go test -race ./... -count=1 -timeout=30s
      - name: Coverage
        if: matrix.go == 'stable'
        run: |
          go test ./... -count=1 -timeout=60s -coverprofile=coverage.out -coverpkg=./...
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          awk -v total="$total" 'BEGIN { if (total+0 < 80) { print "coverage below 80%"; exit 1 } }'
